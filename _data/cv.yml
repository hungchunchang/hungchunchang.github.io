    - title: "Master's Thesis Research (in progress): Validity of LLMs as Simulated Students"
      institution: Department of Psychology, National Taiwan University (Prof. Hsiu-Ping Yueh, Prof. Feng-Ming Tsao, Prof. Hiroaki Ogata)
      year: 2026/02 - Present
      description:
        - "Recast the validity of an ability-conditioned LLM student simulator as a nomological network of four behavioral evidences: profile–behavior consistency, fidelity of error, boundary of competence, and stateful learning."
        - "Tested all four concurrently against real per-tier learner data from the PSLC DataShop Fractions 2012 corpus, using zero-shot prompting and a 2×2 fine-tuning ablation (reasoning × history)."
        - "Found that fine-tuning with reasoning and history simulated students best, yet the competence paradox persisted and the learning mechanism was not reproduced; this first part was accepted at ReLEAF@ICCE 2026 (first author)."
