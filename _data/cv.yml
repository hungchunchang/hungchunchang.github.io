- title: Research Experience
  type: time_table
  contents:
    - title: "Master's Thesis Research (in progress): Validity of LLMs as Simulated Students"
      institution: Department of Psychology, National Taiwan University (Prof. Hsiu-Ping Yueh)
      year: 2025/02 - Present
      description:
        - Tested whether an ability-conditioned LLM student simulator holds up as a construct, using a nomological network of behavioral evidence checked against real learner data from DataShop.
        - "Probed the simulator's internal representations: the ability tier given in the prompt is linearly decodable and steerable, while item-level competence is not recoverable by any readout we could reach."
        - "Built a learner model whose weights update during play: in-context learning left no trace across episodes, while weight updates consolidated rule knowledge that transferred to novel objects."
    - title: Research Intern
